<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Avis Downloads Bridge</title>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: #07080b;
        color: #fff;
        width: 320px;
        padding: 16px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      p {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        line-height: 1.4;
        margin: 0 0 12px;
      }
      label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.4);
        display: block;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        background: #161a23;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: #fff;
        padding: 8px 10px;
        font-size: 13px;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        background: #4fb2ff;
        color: #07080b;
        border: none;
        border-radius: 999px;
        padding: 9px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Avis Downloads Bridge</h1>
    <p>
      Trage hier den Kopplungs-Code aus Avis ein (Einstellungen →
      Browser-Integration). Danach erscheinen deine Browser-Downloads
      automatisch im Downloads-Tab von Avis.
    </p>
    <label for="token">Kopplungs-Code</label>
    <input id="token" type="text" placeholder="z.B. 3f9a1c..." />
    <label for="port">Port (nur ändern, falls in Avis angepasst)</label>
    <input id="port" type="text" placeholder="8721" />
    <button id="save">Speichern</button>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
